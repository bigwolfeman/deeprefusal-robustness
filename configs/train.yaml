# DeepRefusal training. Defaults = faithful paper recipe (section 5.1, Table 4: p = 0.5).
# Variants live in configs/exp/*.yaml; select with `+exp=<name>`.
defaults:
  - _self_

root: /mnt/bigdata/deeprefusal
run_name: dr_baseline
seed: 0
model:
  name: google/gemma-3-1b-it
  tokenizer: null          # null = same as model.name; Prong B uses the -it tokenizer for its chat template
  dtype: bfloat16
direction_path: ${root}/directions/google__gemma-3-1b-it/direction.pt

data:
  seed: 42
  cb_path: ${root}/data/circuit_breakers_train.json
  xstest_path: ${root}/data/xstest_v2_completions_gpt4_gpteval.csv
  overrefusal_repeat: 2                 # official: benign_train_data *= 2
  benign_split: test_sft                # official: ultrachat_200k test_sft
  benign_total: 4000                    # paper: 4,000 benign
  benign_empty_instruction_prob: 0.5    # official switch_select = [0, 1]
  n_harmful_prompts: 2000               # paper: 2,000 CircuitBreaker harmful
  prefill_augmentations: 1
  prefix_min_tokens: 20                 # paper Eq. 11: k ~ U[20, 25]
  prefix_max_tokens: 25
  max_len: 1024

lora:                                   # paper: rank 16, alpha 16 (CircuitBreaker settings)
  r: 16
  alpha: 16
  dropout: 0.05
  targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  epochs: 1
  batch_size: 16                        # paper: 16
  lr: 1.0e-4                            # not stated in paper; CircuitBreaker LoRA default
  warmup_frac: 0.03
  schedule: cosine
  weight_decay: 0.0
  grad_clip: 1.0
  loss_alpha: 0.2                       # paper Eq. 12
  grad_ckpt: true                        # needed on the 3070 (8 GB) at batch 16; approved by Wolfe 2026-10-07
  ce_chunk: 512                         # 512 tok x 262k vocab fp32 = 0.5 GB per chunk
  time_limit_h: 10.0
  save_every: 200

dr:
  enabled: true
  p: 0.5                                # paper Table 4 best; official code default 0.05
  only_response: false                  # official args.py default
  full_prob: 0.0                        # Prong A: probability of an all-site, all-position step
  adaptive:
    enabled: false                      # Prong A
    refit_every: 50
    k_max: 6
    min_ratio: 0.2
    min_layer_frac: 0.25                # refit only layers >= L/4; r_hat stays in all layers
    n_fit: 64

path:                                   # Prong B
  enabled: false
  prob: 0.5
  lambda_min: 0.2
  per_layer: true
  beta: 1.0

eval:
  enabled: true
  n: 100
  max_new_tokens: 96

hf:
  repo: bigwolfe/deeprefusal-robustness-ckpts
  upload: true

wandb:
  project: deeprefusal-robustness
  group: e3-1b
  mode: online

hydra:
  run:
    dir: ${root}/logs/hydra/train/${run_name}/${now:%Y-%m-%d_%H-%M-%S}
